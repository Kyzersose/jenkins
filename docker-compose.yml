services:
  jenkins:
    build: .
    image: local/jenkins-docker:lts
    container_name: jenkins
    restart: unless-stopped
    # PID 1 reaper, so build processes spawned by pipelines don't leak as zombies.
    init: true
    volumes:
      # Named volume = all Jenkins state. Survives `docker rm` and
      # `docker compose down`. Only `down -v` destroys it.
      - jenkins_home:/var/jenkins_home
      # The host's Docker daemon, handed to the container's Docker CLI.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # LAN-reachable: the Cloudflare tunnel runs on a separate box (Pi) and
      # proxies in over the network, so this can't be loopback-only. Give
      # this Mac a static IP / DHCP reservation so the tunnel's route stays
      # valid.
      - "8080:8080"
      - "50000:50000"

volumes:
  jenkins_home:
    # Explicit name so compose doesn't prefix it, and so it reuses the volume
    # you already created with `docker run -v jenkins_home:...`.
    name: jenkins_home
